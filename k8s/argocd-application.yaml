apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextjs-math-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Djtv1304/pipeline-entrega-continua.git'
    targetRevision: main
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true